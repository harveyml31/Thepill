name: Test and build

on:
  push:
    branches: [main, master, "claude/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    name: Full tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: sudo apt-get update -q && sudo apt-get install -y -q xvfb xdotool x11-utils
      - run: npm ci
      - name: Privacy and digest checks
        run: npm test
      - name: App end-to-end
        run: xvfb-run -a -s "-screen 0 1600x1000x24" npx electron --no-sandbox test/e2e-main.js
      - name: Shadow mode end-to-end
        run: xvfb-run -a -s "-screen 0 1600x1000x24" npx electron --no-sandbox test/shadow-e2e.js
      - name: Smoke test
        run: xvfb-run -a -s "-screen 0 1600x1000x24" npx electron --no-sandbox test/smoke.js

  smoke:
    name: Smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Privacy and digest checks
        run: npm test
      - name: Smoke test
        run: npx electron test/smoke.js

  build:
    name: Installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac dmg --arm64 --x64
          - os: windows-latest
            args: --win nsis --x64
          - os: ubuntu-latest
            args: --linux AppImage deb --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build installer
        run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: the-pill-${{ runner.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 30
