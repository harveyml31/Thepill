<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'">
  <title>Claude — The Pill</title>
  <link rel="stylesheet" href="chat.css">
</head>
<body>
  <header class="bar" id="bar">
    <svg class="spark" viewBox="0 0 24 24" aria-hidden="true"><g class="rays"></g></svg>
    <div class="titles">
      <div class="title">Claude</div>
      <div class="status-wrap"><span class="status" id="status">Screen off</span></div>
    </div>
    <button class="chip" id="watch" title="Watch my screen" aria-pressed="false">
      <span class="dot" aria-hidden="true"></span><span id="watchLabel">Screen off</span>
    </button>
    <div class="tools">
      <button class="icon" id="share" title="Share screen now">
        <svg viewBox="0 0 24 24"><path d="M4 8.6A2.6 2.6 0 0 1 6.6 6h1.5l1.5-2h4.8l1.5 2h1.5A2.6 2.6 0 0 1 20 8.6v7.8a2.6 2.6 0 0 1-2.6 2.6H6.6A2.6 2.6 0 0 1 4 16.4z"/><circle cx="12" cy="12.4" r="3.3"/></svg>
      </button>
      <button class="icon" id="rewind" title="Share Rewind: the last few minutes of your screen">
        <svg viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4.5v4h4"/><path d="M12 8.2v4.2l2.8 1.7"/></svg>
        <span class="badge" id="rewindCount"></span>
      </button>
      <button class="icon" id="newChat" title="New chat">
        <svg viewBox="0 0 24 24"><path d="M12 5.5v13M5.5 12h13"/></svg>
      </button>
      <button class="icon" id="more" title="Settings" aria-expanded="false">
        <svg viewBox="0 0 24 24"><path d="M5 7.5h9M18 7.5h1M5 16.5h1M10 16.5h9"/><circle cx="16" cy="7.5" r="2"/><circle cx="8" cy="16.5" r="2"/></svg>
      </button>
      <button class="icon" id="collapse" title="Shrink to pill">
        <svg viewBox="0 0 24 24"><path d="M9.5 4.5v5h-5M14.5 19.5v-5h5M9.5 9.5l-5-5M14.5 14.5l5 5"/></svg>
      </button>
    </div>
    <span class="watchline" aria-hidden="true"></span>
  </header>

  <div id="banner" class="banner" hidden>
    <span id="bannerText"></span>
    <button id="bannerAction" class="link"></button>
    <button id="bannerClose" class="icon small" title="Dismiss"><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17"/></svg></button>
  </div>

  <canvas id="compositor" hidden></canvas>
  <script src="spark.js"></script>
  <script src="chat.js"></script>
</body>
</html>
