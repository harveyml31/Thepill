<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'">
  <title>The Pill</title>
  <link rel="stylesheet" href="pill.css">
</head>
<body>
  <div id="pill" class="pill" title="Click to ask Claude · drag to move · right-click for more">
    <span class="aura" aria-hidden="true"></span>
    <span class="sheen" aria-hidden="true"></span>

    <svg class="spark" viewBox="0 0 24 24" aria-hidden="true"><g class="rays"></g></svg>

    <!-- compact pill -->
    <span class="label compact">
      <span class="title">Claude</span>
      <span class="sub"><span class="rec" aria-hidden="true"></span><span id="sub">Screen off</span></span>
    </span>

    <!-- prompt bar -->
    <form id="ask" class="ask expanded" autocomplete="off">
      <input id="prompt" type="text" placeholder="Ask Claude…" aria-label="Ask Claude" spellcheck="true">
    </form>
    <button id="cam" class="btn expanded" type="button" title="Include my screen with this question" aria-pressed="false">
      <svg viewBox="0 0 24 24"><path d="M4 8.6A2.6 2.6 0 0 1 6.6 6h1.5l1.5-2h4.8l1.5 2h1.5A2.6 2.6 0 0 1 20 8.6v7.8a2.6 2.6 0 0 1-2.6 2.6H6.6A2.6 2.6 0 0 1 4 16.4z"/><circle cx="12" cy="12.4" r="3.3"/></svg>
    </button>
    <button id="eye" class="btn eye" type="button" aria-label="Toggle watching" title="Watch my screen">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M2.5 12s3.5-6.2 9.5-6.2 9.5 6.2 9.5 6.2-3.5 6.2-9.5 6.2S2.5 12 2.5 12Z"/>
        <circle class="pupil" cx="12" cy="12" r="2.9"/>
        <path class="slash" d="M4.5 4.5l15 15"/>
      </svg>
    </button>
    <button id="open" class="btn expanded" type="button" title="Open the full chat here">
      <svg viewBox="0 0 24 24"><path d="M14.5 4.5h5v5M9.5 19.5h-5v-5M19.5 4.5l-6 6M4.5 19.5l6-6"/></svg>
    </button>
    <button id="send" class="send expanded" type="submit" form="ask" title="Send (Enter)" disabled>
      <svg viewBox="0 0 24 24"><path d="M12 18.5V6M6.5 11.5 12 6l5.5 5.5"/></svg>
    </button>
  </div>
  <script src="spark.js"></script>
  <script src="pill.js"></script>
</body>
</html>
